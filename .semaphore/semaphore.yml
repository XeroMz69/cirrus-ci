version: v1.0
name: Docker
agent:
  machine:
    type: e1-standard-8
    os_image: ubuntu2004
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - lsblk
            - free -h
            - lscpu
            - null
            - export DEBIAN_FRONTEND=noninteractive
            - sudo apt update && sudo apt upgrade -y
            - sudo apt install openssh-server openssh-client -y
            - sudo systemctl enable ssh
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
  - name: 'Block #3'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
