version: v1.0
name: Docker
agent:
  machine:
    type: a2-standard-4
    os_image: ubuntu2004
blocks:
  - name: Build
    task:
      jobs:
        - name: docker build
          commands:
            - checkout
            - lsblk
            - free -h
            - lscpu
            - df -h
            - export DEBIAN_FRONTEND=noninteractive
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
  - name: 'Block #3'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
